name: 🐛 Bug Report
description: Report a bug or issue in Infyn DL
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting an issue! Please provide as much detail as possible to help us reproduce and fix it quickly.

  - type: dropdown
    id: platform
    attributes:
      label: Operating System / Platform
      description: Which platform did you experience the issue on?
      options:
        - Windows 11 (x64)
        - Windows 10 (x64)
        - Android 14+
        - Android 13
        - Android 12 or older
      default: 0
    validations:
      required: true

  - type: input
    id: app_version
    attributes:
      label: Infyn DL Version
      description: What version of Infyn DL are you running? (e.g., v1.0.0, commit hash)
      placeholder: "v1.0.0"
    validations:
      required: true

  - type: textarea
    id: description
    attributes:
      label: Problem Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: reproduction_steps
    attributes:
      label: Steps to Reproduate
      description: How can we reproduce this behavior step by step?
      placeholder: |
        1. Open Infyn DL
        2. Paste URL '...'
        3. Click 'Download Audio'
        4. See error '...'
    validations:
      required: true

  - type: textarea
    id: expected_behavior
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: media_url
    attributes:
      label: Media URL Tested (if applicable)
      description: If this issue happens with a specific video/audio/playlist link, provide it here.
    validations:
      required: false

  - type: textarea
    id: logs
    attributes:
      label: Logs or Console Output
      description: Paste any error messages, terminal logs, or stack traces.
      render: shell
    validations:
      required: false
