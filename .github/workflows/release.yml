name: Release Build & Publish

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build-android:
    name: Build Android Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Install Dart & Flutter Dependencies
        run: flutter pub get

      - name: Run Static Analysis & Tests
        run: |
          flutter analyze
          flutter test

      - name: Build Universal Android APK
        run: flutter build apk --release

      - name: Build ARM64 Android APK
        run: flutter build apk --release --target-platform android-arm64

      - name: Package Android Artifacts
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG="${RAW_TAG:-v1.0.0}"
          
          mkdir -p staging-android
          
          # 1. Universal APK (All Android devices)
          if [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "staging-android/Infyn-DL-${TAG}-android.apk"
          fi
          
          # 2. ARM64 APK (Modern smartphones & tablets)
          if [ -f "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-arm64-v8a-release.apk" "staging-android/Infyn-DL-${TAG}-android-arm64.apk"
          elif [ -f "build/app/outputs/flutter-apk/app-release.apk" ]; then
            cp "build/app/outputs/flutter-apk/app-release.apk" "staging-android/Infyn-DL-${TAG}-android-arm64.apk"
          fi
          
          ls -lh staging-android

      - name: Upload Android Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: android-release-assets
          path: staging-android/*
          if-no-files-found: error
          retention-days: 2

  build-windows:
    name: Build Windows Portable Package
    runs-on: windows-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Flutter SDK
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'
          cache: true

      - name: Verify Flutter & Environment
        run: |
          flutter --version
          flutter doctor -v

      - name: Download yt-dlp, FFmpeg & QuickJS Binaries
        shell: pwsh
        run: |
          .\tool\setup_binaries.ps1

      - name: Install Dart & Flutter Dependencies
        run: flutter pub get

      - name: Build Windows Executable Bundle
        run: flutter build windows --release

      - name: Package Windows ZIP Archive & Setup Installer EXE
        shell: pwsh
        run: |
          $rawTag = "${{ github.event.inputs.tag_name }}"
          if ([string]::IsNullOrWhiteSpace($rawTag)) {
            $rawTag = "${{ github.ref_name }}"
          }
          if ([string]::IsNullOrWhiteSpace($rawTag)) {
            $rawTag = "v1.0.0"
          }

          New-Item -ItemType Directory -Force -Path staging-windows | Out-Null

          # 1. Locate Release directory
          $releaseDir = "build\windows\x64\runner\Release"
          if (!(Test-Path $releaseDir)) {
            $releaseDir = "build\windows\runner\Release"
          }
          if (!(Test-Path $releaseDir)) {
            Write-Error "Could not locate Flutter Windows release build directory!"
            exit 1
          }

          Write-Host "Found Windows release directory at $releaseDir"

          # 2. Create Portable ZIP Archive
          $zipName = "Infyn-DL-$rawTag-windows-portable.zip"
          $zipPath = Join-Path "staging-windows" $zipName
          Compress-Archive -Path "$releaseDir\*" -DestinationPath $zipPath -CompressionLevel Optimal -Force
          Write-Host "Created Windows portable archive: $zipPath"

          # 3. Compile Windows Setup Installer EXE using Inno Setup
          Write-Host "Compiling Windows Setup Installer EXE with Inno Setup..."
          if (!(Get-Command iscc.exe -ErrorAction SilentlyContinue)) {
            if (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe") {
              $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
            } else {
              choco install innosetup --no-progress -y
              $env:PATH += ";C:\Program Files (x86)\Inno Setup 6"
            }
          }

          $installerBaseName = "Infyn-DL-$rawTag-windows-setup"
          $issFile = "windows\installer\inno_setup.iss"
          $fullReleaseDir = (Resolve-Path $releaseDir).Path
          $fullStagingDir = (Resolve-Path "staging-windows").Path

          & iscc.exe /DMyAppVersion="$rawTag" /DSourceDir="$fullReleaseDir" /DOutputDir="$fullStagingDir" /DOutputBaseFilename="$installerBaseName" "$issFile"

          Get-ChildItem staging-windows

      - name: Upload Windows Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-release-assets
          path: staging-windows/*
          if-no-files-found: error
          retention-days: 2

  publish-release:
    name: Publish GitHub Release
    needs: [build-android, build-windows]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Create Distribution Directory
        run: mkdir -p dist

      - name: Download Android Artifacts
        uses: actions/download-artifact@v4
        with:
          name: android-release-assets
          path: dist/

      - name: Download Windows Artifacts
        uses: actions/download-artifact@v4
        with:
          name: windows-release-assets
          path: dist/

      - name: Generate Consolidated Checksums
        shell: bash
        run: |
          cd dist
          echo "### 🔒 SHA-256 Checksums" > checksums.txt
          echo '```' >> checksums.txt
          for f in *; do
            if [ -f "$f" ] && [[ "$f" != "checksums.txt" ]]; then
              sha256sum "$f" >> checksums.txt
            fi
          done
          echo '```' >> checksums.txt
          cat checksums.txt

      - name: Publish or Update GitHub Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          RAW_TAG="${{ github.event.inputs.tag_name || github.ref_name }}"
          TAG="${RAW_TAG:-v1.0.0}"
          
          PRERELEASE_FLAG=""
          if [[ "$TAG" == *"alpha"* ]] || [[ "$TAG" == *"beta"* ]] || [[ "$TAG" == *"rc"* ]]; then
            PRERELEASE_FLAG="--prerelease"
          fi

          {
            echo "## 🚀 Infyn DL $TAG"
            echo ""
            echo "Universal, local-first media & music downloader for **Windows** and **Android**."
            echo ""
            echo "---"
            echo ""
            echo "### 📦 Download Packages"
            echo ""
            echo "| Platform | Package | Description |"
            echo "| :--- | :--- | :--- |"
            echo "| 🪟 **Windows** | \`Infyn-DL-${TAG}-windows-setup.exe\` | **Recommended**: Single-file setup installer with Desktop & Start Menu shortcuts. |"
            echo "| 🪟 **Windows** | \`Infyn-DL-${TAG}-windows-portable.zip\` | **Portable**: Extract anywhere and run \`media_downloader.exe\`. No setup needed. |"
            echo "| 📱 **Android** | \`Infyn-DL-${TAG}-android.apk\` | **Universal APK**: Works on all Android phones, tablets, and TVs (Android 7.0+). |"
            echo "| 📱 **Android** | \`Infyn-DL-${TAG}-android-arm64.apk\` | **ARM64 APK**: Optimized, lightweight build for modern 64-bit Android smartphones. |"
            echo ""
            echo "---"
            echo ""
            echo "### 🛠️ Installation Guide"
            echo ""
            echo "#### Windows:"
            echo "- **Option 1 (Installer)**: Download and run \`Infyn-DL-${TAG}-windows-setup.exe\`."
            echo "- **Option 2 (Portable)**: Download and extract \`Infyn-DL-${TAG}-windows-portable.zip\`, then run \`media_downloader.exe\`."
            echo ""
            echo "#### Android:"
            echo "1. Download \`Infyn-DL-${TAG}-android.apk\` (or ARM64 APK)."
            echo "2. Tap the downloaded file to install on your phone."
            echo "3. Open **Infyn DL** and grant storage permissions when prompted."
            echo ""
            echo "---"
            echo ""
            cat dist/checksums.txt
          } > release_body.md

          cat release_body.md

          # Create or update GitHub Release using GitHub CLI
          if gh release view "$TAG" > /dev/null 2>&1; then
            echo "Release $TAG exists. Updating release notes and uploading assets with clobber..."
            gh release edit "$TAG" --title "Infyn DL $TAG" --notes-file release_body.md $PRERELEASE_FLAG
            gh release upload "$TAG" dist/* --clobber
          else
            echo "Creating new release $TAG..."
            gh release create "$TAG" dist/* \
              --title "Infyn DL $TAG" \
              --notes-file release_body.md \
              $PRERELEASE_FLAG \
              --clobber
          fi
